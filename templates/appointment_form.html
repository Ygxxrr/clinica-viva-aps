{% extends 'base.html' %}{% block actions %}<a class="button" href="{{ url_for('agenda') }}">Voltar à agenda</a>{% endblock %}{% block content %}<section class="panel form-panel"><div class="panel-heading"><div><h2>Organize o próximo atendimento</h2><p>Horários de 30 minutos. A disponibilidade é validada ao salvar.</p></div></div><form class="form-body" method="post">{{ csrf() }}<div class="form-grid"><label>Paciente *<select name="patient_id" required><option value="">Selecione o paciente</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></label><label>Médico *<select name="doctor_id" id="doctor-select" required><option value="">Selecione o médico</option>{% for d in doctors %}<option value="{{ d.id }}" data-specialties="{{ d.specialties|map(attribute='id')|list|tojson }}" data-units="{{ d.units|map(attribute='id')|list|tojson }}">{{ d.name }}</option>{% endfor %}</select></label><label>Especialidade *<select name="specialty_id" id="specialty-select" required><option value="">Selecione a especialidade</option>{% for s in specialties %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><label>Unidade *<select name="unit_id" id="unit-select" required><option value="">Selecione a unidade</option>{% for u in units %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}</select></label><label>Data e horário *<input name="starts_at" type="datetime-local" step="1800" value="{{ today }}T09:00" required></label><label class="span-2">Observações<textarea name="notes" rows="3" placeholder="Informações úteis para o atendimento"></textarea></label></div><div class="form-actions"><a class="button" href="{{ url_for('agenda') }}">Cancelar</a><button class="button primary">Confirmar agendamento</button></div></form></section>{% endblock %}
